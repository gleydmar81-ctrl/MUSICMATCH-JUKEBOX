<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="40%" stop-color="#1c1c1c" />
      <stop offset="65%" stop-color="#111" />
      <stop offset="85%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <radialGradient id="labelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="70%" stop-color="#008844" />
      <stop offset="100%" stop-color="#004422" />
    </radialGradient>
  </defs>
  <!-- Vinyl Body -->
  <circle cx="100" cy="100" r="96" fill="url(#discGrad)" stroke="#333" stroke-width="2" />
  
  <!-- Grooves -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#222" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#262626" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#222" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#282828" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#222" stroke-width="0.8" opacity="0.6"/>

  <!-- Center Label -->
  <circle cx="100" cy="100" r="34" fill="url(#labelGrad)" stroke="#003311" stroke-width="1.5" />
  
  <!-- Center Text -->
  <text x="100" y="93" font-family="sans-serif" font-size="8" font-weight="bold" fill="#002211" text-anchor="middle" letter-spacing="1">MUSICMATCH</text>
  <text x="100" y="103" font-family="sans-serif" font-size="7" fill="#002211" text-anchor="middle">JUKEBOX</text>
  
  <!-- Spindle Hole -->
  <circle cx="100" cy="100" r="7" fill="#fff" stroke="#999" stroke-width="1.5" />
  <circle cx="100" cy="100" r="5" fill="#000" />
</svg>
